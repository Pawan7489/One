<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Project A1 - Premium Indian AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=4.0">
</head>
<body>
    <div class="ambient-bg-glow"></div>

    <div class="main-wrapper">
        
        <div id="auth-screen" class="app-screen">
            <div class="login-content">
                <div class="logo-box aura-glow">A1</div>
                <h1 class="welcome-text">Swagat Hai</h1>
                <p class="subtitle">Secure Digital Companion</p>
                
                <div class="auth-tabs">
                    <button id="tab-login" class="auth-tab">Login</button>
                    <button id="tab-signup" class="auth-tab active">Sign Up</button>
                </div>

                <form id="signup-form" class="auth-form">
                    <div class="input-field">
                        <input type="text" id="reg-name" required placeholder="Aapka Poora Naam">
                    </div>
                    <div class="input-row">
                        <div class="input-field w-50">
                            <input type="date" id="reg-dob" required>
                        </div>
                        <div class="input-field w-50">
                            <select id="reg-gender">
                                <option value="male">Male (Purush)</option>
                                <option value="female">Female (Mahila)</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary apple-btn">Create Secure Account</button>
                </form>

                <form id="login-form" class="auth-form hidden">
                    <div class="input-field">
                        <input type="text" required placeholder="Username ya Email">
                    </div>
                    <div class="input-field">
                        <input type="password" required placeholder="Password">
                    </div>
                    <div class="forgot-links">
                        <a href="#">Forgot Username?</a>
                        <a href="#">Forgot Password?</a>
                    </div>
                    <button type="submit" class="btn-primary apple-btn">Login</button>
                </form>

                <div class="social-divider"><span>OR CONTINUE WITH</span></div>
                <div class="social-logins">
                    <button class="social-btn apple-btn">🌐 Google</button>
                    <button class="social-btn apple-btn">🐙 GitHub</button>
                    <button class="social-btn apple-btn">📱 OTP</button>
                </div>
            </div>
        </div>

        <div id="chat-screen" class="app-screen hidden">
            <div class="header">
                <div class="logo-text">A1</div>
                <div class="mode-badge" id="persona-badge">Mode: Active</div>
            </div>

            <div class="hologram-stage">
                <div class="hologram-container" id="hologram">
                    <div class="aura-ring ring-1"></div>
                    <div class="aura-ring ring-2"></div>
                    <div class="hologram-core">A1</div>
                </div>
                <p id="status-text">Ready...</p>
            </div>

            <div class="chat-box" id="chat-box"></div>

            <div class="advanced-input-container">
                <div class="version-selector">
                    <select id="ai-version">
                        <option value="llama3-8b-8192">A1 Core (Fast Chat)</option>
                        <option value="mixtral-8x7b-32768">A1 Pro (Deep Search & Logic)</option>
                        <option value="v3">A1 Vision (Images & Video)</option>
                        <option value="mixtral-8x7b-32768">A1 Max (Coding & Finance)</option>
                    </select>
                </div>

                <div class="input-wrapper">
                    <div class="action-menu-wrapper">
                        <button id="plus-btn" class="icon-btn plus-icon" type="button">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        </button>
                        <div id="action-menu" class="action-menu hidden">
                            <div class="menu-item">📷 Upload Photo/Video</div>
                            <div class="menu-item">📁 Select Document</div>
                            <div class="menu-item">☁️ Google Photos</div>
                            <hr>
                            <div class="menu-item">🎨 Generate Image</div>
                            <div class="menu-item">🔍 Deep Web Search</div>
                            <div class="menu-item">💻 Code Generator</div>
                        </div>
                    </div>

                    <input type="text" id="user-input" placeholder="Message ya command..." autocomplete="off">
                    
                    <button id="mic-btn" class="icon-btn mic-icon" type="button">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>
                    </button>

                    <button id="send-btn" class="icon-btn send-arrow" type="button" onclick="sendMessageToAI()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </div>
            </div>

            <div class="security-footer">
                <span class="shield">🛡️ End-to-End Encrypted</span> • 
                <span class="india">🇮🇳 Made in India</span> • 
                <span class="text-green">🔒 100% Privacy</span>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}?v=4.0"></script>


<script>
    /* ==========================================================
       COMMANDER AI CONFIGURATION (CONNECTED)
       ========================================================== */
    const ADMIN_PANEL_URL = "https://a1-zc43.onrender.com/api/ai/ask";
    const AI_DISPLAY_NAME = "Commander AI";

    // Request Counter Setup
    let rawCount = localStorage.getItem('user_request_count');
    if (!rawCount || isNaN(rawCount)) {
        localStorage.setItem('user_request_count', '0');
    }

    async function sendMessageToAI() {
        const inputField = document.getElementById('user-input');
        const chatDisplay = document.getElementById('chat-box');
        const aiVersion = document.getElementById('ai-version').value;
        const query = inputField.value.trim();
        
        if (!query) return;

        // 1. Update Counter
        let count = parseInt(localStorage.getItem('user_request_count')) + 1;
        localStorage.setItem('user_request_count', count);

        // UI Loading State
        const loadingId = "load-" + Date.now();
        chatDisplay.innerHTML += `<div id="${loadingId}" style="color: #00d2ff; font-size: 0.8em; margin: 10px 0;">A1 is thinking (Req #${count})...</div>`;
        inputField.value = ""; 
        chatDisplay.scrollTop = chatDisplay.scrollHeight;

        try {
            // 2. Sending Data to Admin Panel
            const response = await fetch(ADMIN_PANEL_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ 
                    query: query,
                    engine: aiVersion, // Pass version to engine_router
                    request_id: count 
                })
            });

            const data = await response.json();
            document.getElementById(loadingId).remove();

            if (data.status === "success") {
                // 3. Display Clean Result
                chatDisplay.innerHTML += `
                    <div class="message ai-msg" style="margin-bottom: 20px; animation: fadeIn 0.3s ease;">
                        <span style="font-weight: bold; color: #00d2ff;">${AI_DISPLAY_NAME}:</span>
                        <div style="line-height: 1.6; margin-top: 5px; color: #fff;">
                            ${data.answer}
                        </div>
                        <div style="color: #444; font-size: 0.6em; margin-top: 5px;">REQ-ID: ${count}</div>
                    </div>
                `;
                chatDisplay.scrollTop = chatDisplay.scrollHeight;
            } else {
                chatDisplay.innerHTML += `<div style="color: #ff4757; font-size: 0.8em;">Error: ${data.message}</div>`;
            }
        } catch (error) {
            if(document.getElementById(loadingId)) document.getElementById(loadingId).remove();
            chatDisplay.innerHTML += `<div style="color: #ff4757; font-size: 0.8em;">Commander, check your connection. Server unreachable.</div>`;
        }
    }

    // Enter Key Support
    document.getElementById('user-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            sendMessageToAI();
        }
    });

    // Simple Tab Switcher for Auth (Design preservation)
    document.getElementById('tab-login')?.addEventListener('click', () => {
        document.getElementById('login-form').classList.remove('hidden');
        document.getElementById('signup-form').classList.add('hidden');
        document.getElementById('tab-login').classList.add('active');
        document.getElementById('tab-signup').classList.remove('active');
    });
    document.getElementById('tab-signup')?.addEventListener('click', () => {
        document.getElementById('signup-form').classList.remove('hidden');
        document.getElementById('login-form').classList.add('hidden');
        document.getElementById('tab-signup').classList.add('active');
        document.getElementById('tab-login').classList.remove('active');
    });
</script>

</body>
</html>
