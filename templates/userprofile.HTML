<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A1 - User Profile</title>
    <link rel="stylesheet" href="../static/css/userprofile.css">
</head>
<body>
    <div class="ambient-bg"></div>
    
    <div class="profile-wrapper">
        <header class="profile-header">
            <button class="back-btn" onclick="history.back()">←</button>
            <h2>👤 Profile Dashboard</h2>
        </header>

        <div class="profile-card">
            <div class="avatar-section">
                <div class="avatar-wrapper">
                    <img src="https://via.placeholder.com/150" id="profile-img-preview" alt="User">
                    <label for="avatar-upload" class="upload-badge">✏️</label>
                    <input type="file" id="avatar-upload" hidden accept="image/*">
                </div>
                <h3 id="display-name">Commander User</h3>
                <span class="status-badge">Verified Member</span>
            </div>

            <form id="profile-form">
                <div class="form-section">
                    <h4>Personal Information</h4>
                    <div class="input-field">
                        <label>Aapka Naam</label>
                        <input type="text" id="user-name" value="Commander User">
                    </div>
                    <div class="input-row">
                        <div class="input-field">
                            <label>Date of Birth</label>
                            <input type="date" id="user-dob" value="2000-01-01">
                        </div>
                        <div class="input-field">
                            <label>Gender</label>
                            <select id="user-gender">
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h4>Security & Verification</h4>
                    <div class="verify-field">
                        <label>Email ID</label>
                        <div class="verify-row">
                            <input type="email" id="user-email" value="commander@a1.ai">
                            <button type="button" class="btn-verify" id="verify-email">Verify</button>
                        </div>
                    </div>
                    <div class="verify-field">
                        <label>Mobile Number</label>
                        <div class="verify-row">
                            <input type="tel" id="user-phone" value="+91 9876543210">
                            <button type="button" class="btn-verify" id="verify-phone">Verify</button>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-save apple-btn">Update Profile Details</button>
            </form>
        </div>
    </div>

    <script src="../static/js/userprofile.js"></script>
</body>
</html>
