<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Project A1 - Modular Master</title>
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>
    <div class="ambient-bg-glow"></div>
    <div id="a1-animation-assets"></div> <div class="main-wrapper">
        
        <div id="auth-section">
            <div id="signup-screen" class="app-screen">
                </div>
            <div id="login-screen" class="app-screen hidden">
                </div>
        </div>

        <div id="chat-screen" class="app-screen hidden full-layout">
            
            <aside class="sidebar" id="app-sidebar">
                </aside>

            <main class="chat-area">
                <header class="chat-header">
                    <button id="menu-toggle" class="icon-btn">☰</button>
                    <div class="mini-hologram">A1</div>
                    <div class="right-header">
                        <button id="live-voice-mode-btn">🎙️ Live Chat</button>
                        <button id="profile-btn">👤</button>
                    </div>
                </header>

                <div class="chat-box" id="chat-box">
                    <div id="chat-messages"></div>
                </div>

                <div id="ai-thinking-indicator" class="ai-thinking-box hidden">
                    <div class="spinner"></div>
                    <div class="thinking-steps">
                        <span class="step step-1">🔍 Cache Database Check...</span>
                    </div>
                </div>

                <div class="bottom-assembly">
                    </div>
            </main>
        </div>
    </div>

    <div id="modals-container">
        </div>

    <script src="../static/js/heptic.js"></script>
    <script src="../static/js/animation.js"></script>
    <script src="../static/js/script.js"></script>
</body>
</html>
