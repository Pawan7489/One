name: Sync to Hugging Face hub
on:
  push:
    branches: [main] # Agar aapki branch ka naam 'master' hai, toh ise 'master' kar dein

  # Repo ko manually sync karne ka option
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: git push --force https://Rohan7789:$HF_TOKEN@huggingface.co/spaces/Rohan7789/one main
