<div class="bottom-container">
    <div class="input-main-wrapper">
        
        <div class="plus-menu-container">
            <button id="plus-btn" class="plus-icon-btn" type="button" title="Add Attachments">
                <span class="plus-symbol">+</span>
            </button>
            <div id="attachment-menu" class="attachment-menu hidden">
                <button class="menu-item"><span class="icon">📸</span> Photo Click (Camera)</button>
                <button class="menu-item"><span class="icon">📷</span> Photo/Video Upload</button>
                <button class="menu-item"><span class="icon">📁</span> File Upload</button>
                <button class="menu-item"><span class="icon">☁️</span> Drive / Cloud Upload</button>
            </div>
        </div>

        <div id="voice-visualizer" class="voice-anim-overlay hidden">
            <div class="wave"></div><div class="wave"></div><div class="wave"></div>
        </div>

        <div class="textarea-box">
            <textarea id="user-prompt" placeholder="Apna prompt ya sawal likhein..." rows="1"></textarea>
        </div>

        <div class="action-buttons">
            <button id="mic-btn" class="mic-icon-btn" type="button" title="Voice Chat">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                    <line x1="12" y1="19" x2="12" y2="23"></line>
                </svg>
            </button>
            <button id="send-btn" class="send-icon-btn" type="button">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>
    
    <div class="live-status-bar">
        <span class="live-badge">A1 Live Voice Mode: Ready</span>
    </div>
</div>
