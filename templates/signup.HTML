<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A1 - Sign Up</title>
    <link rel="stylesheet" href="../static/css/signup.css">
</head>
<body>
    <div class="ambient-bg"></div>
    <div class="auth-container">
        <div class="logo-box">A1</div>
        <h1>Namaste! 🙏</h1>
        <p class="subtitle">Naya Account Banayein</p>

        <form id="signup-form">
            <div class="input-group">
                <input type="text" id="name" placeholder="Poora Naam" required>
            </div>
            <div class="input-group">
                <input type="text" id="username" placeholder="Username" required>
            </div>
            <div class="input-row">
                <input type="password" id="pass" placeholder="Password" required>
                <input type="password" id="confirm-pass" placeholder="Confirm" required>
            </div>
            <div class="input-row">
                <input type="date" id="dob" required>
                <select id="gender">
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>
            </div>
            <button type="submit" class="btn-main">Create Account</button>
            <button type="button" id="guest-btn" class="btn-sub">👤 Continue as Guest</button>
        </form>

        <div class="social-box">
            <span>OR SIGN UP WITH</span>
            <div class="social-grid">
                <button class="s-btn">🌐 Google</button>
                <button class="s-btn">📱 OTP</button>
                <button class="s-btn">🐙 GitHub</button>
                <button class="s-btn">📘 FB</button>
                <button class="s-btn">📸 Insta</button>
                <button class="s-btn">📞 True</button>
            </div>
        </div>
        <p class="footer-link">Pehle se account hai? <a href="login.HTML">Login Karein</a></p>
    </div>
    <script src="../static/js/signup.js"></script>
</body>
</html>
