<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Project A1 - Final Assembly</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="ambient-bg-glow"></div>
    {% include 'animation.HTML' %} <div class="main-wrapper">
        <div id="signup-screen" class="app-screen">
            {% include 'signup.HTML' %}
        </div>
        <div id="login-screen" class="app-screen hidden">
            {% include 'login.HTML' %}
        </div>

        <div id="chat-screen" class="app-screen hidden full-layout">
            {% include 'menusidebar.HTML' %} <main class="chat-area">
                <header class="chat-header">
                    <button id="menu-toggle" class="icon-btn">☰</button>
                    <div class="mini-hologram">A1</div>
                    <div class="right-header">
                        <button id="live-voice-mode-btn">🎙️ Live Chat</button>
                        <button id="profile-btn">👤</button>
                    </div>
                </header>

                <div class="chat-box" id="chat-box">
                    {% include 'chatroom.HTML' %} </div>

                <div id="ai-thinking-indicator" class="ai-thinking-box hidden">
                    <div class="spinner"></div>
                    <div class="thinking-steps">
                        <span class="step">🔍 Processing Module...</span>
                    </div>
                </div>

                <div class="bottom-assembly">
                    {% include 'bottom.HTML' %} </div>
            </main>
        </div>
    </div>

    <div id="global-modals">
        {% include 'userprofile.HTML' %}
        {% include 'voice.HTML' %}
        {% include 'heptic.HTML' %}
    </div>

    <script src="{{ url_for('static', filename='js/heptic.js') }}"></script>
    <script src="{{ url_for('static', filename='js/animation.js') }}"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
