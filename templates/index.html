<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Project A1 - Master V13.0</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="ambient-bg-glow"></div>

    <div class="main-wrapper">
        <div id="signup-screen" class="app-screen active-screen">
            <div class="auth-box animate-slide-up">
                <div class="logo-box aura-glow">A1</div>
                <h1>Namaste! 🙏</h1>
                <p>Aapka Apna Secure AI Companion</p>
                <div class="input-field"><input type="text" id="reg-name" placeholder="Poora Naam"></div>
                <div class="input-field"><input type="text" id="reg-user" placeholder="Username"></div>
                <div class="input-row">
                    <input type="password" id="reg-pass" placeholder="Password">
                    <input type="password" id="reg-confirm" placeholder="Confirm">
                </div>
                <button id="signup-submit-btn" class="btn-primary apple-btn">Create Secure Account</button>
                <p class="footer-link">Account hai? <a href="#" id="go-to-login">Login Karein</a></p>
            </div>
        </div>

        <div id="login-screen" class="app-screen">
            <div class="auth-box">
                <div class="logo-box aura-glow">A1</div>
                <h1>Welcome Back</h1>
                <div class="input-field"><input type="text" placeholder="Username / Email"></div>
                <div class="input-field"><input type="password" placeholder="Password"></div>
                <button id="login-submit-btn" class="btn-primary apple-btn">Secure Login</button>
                <p class="footer-link">Naya account? <a href="#" id="go-to-signup">Sign Up</a></p>
            </div>
        </div>

        <div id="chat-screen" class="app-screen full-layout">
            <aside class="sidebar" id="app-sidebar">
                <button class="new-chat-btn">+ Naya Chat</button>
                <ul class="ai-tools-list">
                    <li class="active">💬 AI Chat Core</li>
                    <li>🎨 AI Photo Generate</li>
                    <li>🎬 AI Video Generate</li>
                    <li>🔍 Deep Search</li>
                </ul>
                <div class="sidebar-bottom">
                    <button id="settings-btn" class="settings-btn">⚙️ AI Control</button>
                </div>
            </aside>

            <main class="chat-area">
                <header class="chat-header">
                    <button id="menu-toggle">☰</button>
                    <div class="mini-hologram">A1</div>
                    <button id="profile-btn" class="profile-btn">👤</button>
                </header>
                <div class="chat-box" id="chat-box">
                    <div id="chat-messages"></div>
                </div>
                <div class="input-assembly">
                    <div class="input-wrapper">
                        <button id="plus-btn">+</button>
                        <textarea id="user-prompt" placeholder="Message dijiye..." rows="1"></textarea>
                        <button id="send-btn">➤</button>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div id="profile-modal" class="custom-modal">
        <div class="modal-content">
            <h2>👤 Profile Dashboard</h2>
            <div class="input-field"><label>Naam</label><input type="text" value="Commander"></div>
            <button id="close-profile" class="btn-primary">Update Profile</button>
        </div>
    </div>

    <div class="security-badge-footer">
        <span class="shield">🛡️ End-to-End Encrypted</span> | 
        <span class="india">🇮🇳 Made in India</span> | 
        <span class="lock">🔒 100% Privacy Secure</span>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
